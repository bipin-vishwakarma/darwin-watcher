[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "darwin-android-agent"
version = "0.1.0"
description = "A safe, LangGraph-powered Android automation agent built on ADB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bipin Vishwakarma" }]
dependencies = [
  "langgraph==1.2.11",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14.2,<15",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
ai = [
  "langchain-openai>=1.1,<2",
]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
darwin = "darwin.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/darwin"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

